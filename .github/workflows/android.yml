name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidentally tracked credentials
        run: python3 tools/check_public_files.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Use fake build-only Firebase configuration
        run: cp app/google-services.example.json app/google-services.json
      - name: Build, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
